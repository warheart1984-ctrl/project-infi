# Free-first policy pack — local agents + optional free cloud keys.
# Cloud: OpenRouter Free Models Router, Groq free tier (when keys present).
# Image/video generation is out of scope for this pack (not free/reliable).

# General coding → local first, then free cloud
- id: "coding.free.general"
  when:
    domain: "coding"
    risk: "low"
  then:
    routing:
      preferred_backends: ["ollama", "lm-studio", "deepseek-coder", "local-llm", "openrouter-free", "groq", "cursor"]

# Fast cloud iteration when Groq is available
- id: "coding.free.fast_cloud"
  when:
    domain: "coding"
    tags: ["fast", "cloud"]
  then:
    routing:
      preferred_backends: ["groq", "openrouter-free", "ollama"]

# Multi-file reasoning → local coder models, then OpenRouter free pool
- id: "coding.free.multi_file"
  when:
    domain: "coding"
    tags: ["multi-file"]
  then:
    routing:
      allowed_backends: ["ollama", "deepseek-coder", "lm-studio", "openrouter-free", "groq"]
    guardrails:
      require_identity_role: ["developer", "system"]

# Local project refactoring → Cursor (free when running locally)
- id: "coding.free.local_project"
  when:
    domain: "coding"
    tags: ["local-project"]
  then:
    routing:
      allowed_backends: ["cursor", "ollama", "lm-studio", "openrouter-free"]
      preferred_backends: ["cursor"]
    guardrails:
      max_tokens_out: 4096

# Agentic tool-use → Devin local or Ollama
- id: "coding.free.agentic"
  when:
    domain: "coding"
    tags: ["agentic", "tool-use"]
  then:
    routing:
      allowed_backends: ["devin", "ollama", "cursor"]
    guardrails:
      require_identity_role: ["developer", "system"]

# Sensitive code → local only (never cloud)
- id: "coding.free.sensitive"
  when:
    domain: "coding"
    tags: ["sensitive", "proprietary", "phi"]
  then:
    routing:
      allowed_backends: ["ollama", "lm-studio", "local-llm"]
    guardrails:
      require_identity_role: ["developer", "system"]

# High risk → prefer strongest local model available
- id: "coding.free.high_risk"
  when:
    domain: "coding"
    risk: "high"
  then:
    routing:
      preferred_backends: ["ollama", "lm-studio", "deepseek-coder", "openrouter-free"]
    guardrails:
      require_identity_role: ["developer", "system"]
