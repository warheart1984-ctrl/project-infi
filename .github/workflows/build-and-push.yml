name: Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
    tags:
      - v*
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ops-console, platform-api, platform-web, sovereign-control-plane, uss-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE=${{ matrix.service }}
            NODE_VERSION=20
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write immutable digest artifact
        if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''
        run: |
          mkdir -p digests
          cat > "digests/${{ matrix.service }}.json" <<EOF
          {
            "service": "${{ matrix.service }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}",
            "gitSha": "${{ github.sha }}",
            "runId": "${{ github.run_id }}"
          }
          EOF

      - name: Upload digest artifact
        if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.json
          if-no-files-found: error

  merge-image-digests:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Merge digests into image-tags.json
        run: pnpm exec tsx tools/merge-image-digests.ts --digests-dir digests

      - name: Upload merged image-tags
        uses: actions/upload-artifact@v4
        with:
          name: baseline-image-tags
          path: docs/release/production-baseline/aaes-os-v1.0/evidence/image-tags.json

      - name: Open PR with digest pins
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(ops): pin GHCR digests into Production Baseline image-tags'
          title: 'chore(ops): pin GHCR digests into Production Baseline image-tags'
          body: |
            CI-emitted immutable digests merged into `image-tags.json`.

            Digests are required before OEL certificate promotion (HOLD → ACTIVE).
          branch: chore/baseline-image-digests
          add-paths: |
            docs/release/production-baseline/aaes-os-v1.0/evidence/image-tags.json

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        run: npm install -g pnpm@10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Build all packages
        run: pnpm run build

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy SARIF for baseline evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-baseline-sarif
          path: trivy-results.sarif
