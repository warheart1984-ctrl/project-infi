version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: aais-db
    environment:
      POSTGRES_USER: aais
      POSTGRES_PASSWORD: aais_password
      POSTGRES_DB: aais_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aais"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aais-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aais-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aais-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aais-backend
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://aais:aais_password@db:5432/aais_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      RATE_LIMIT: 60
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    networks:
      - aais-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aais-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aais-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: aais-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aais-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  aais-network:
    driver: bridge
